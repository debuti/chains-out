[project]
name = "chainsout"
version = "0.4.1"
description = "Buscador personal de ofertas de embedded/firmware remoto con filtro LLM y avisos por Telegram"
readme = "README.md"
authors = [
    { name = "Borja García", email = "user@server" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-jobspy==1.4.1",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
chainsout = "chainsout.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-root = ""

[project.optional-dependencies]
api = ["anthropic>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls the real LLM (consumes quota); run with --llm"]
