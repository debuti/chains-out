# Ejemplo: Pentester/AppSec en Polonia.

defaults:
  hours_old: 24
  results_wanted: 25
  pause_seconds: [4, 9]

terms:
  - penetration tester
  - application security engineer
  - red team
  - offensive security

sources:
  linkedin: {enabled: true, locations: [Poland, European Union, Remote]}
  indeed: {enabled: true, countries: [poland, germany]}
  google: {enabled: false}
  hn: {enabled: true, previous_thread_grace_days: 10}
  companies: {enabled: false}   # sin companies.yaml en este ejemplo
  boards:
    enabled: true
    boards:
      remoteok: {enabled: true}
      remotive: {enabled: true, category: software-dev, min_interval_hours: 8}
      weworkremotely: {enabled: true, categories: [remote-programming-jobs, remote-devops-sysadmin-jobs]}
      himalayas: {enabled: true, country: Poland, queries: [security, pentest, appsec]}
